<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="theme-color"
      content="#0b0f19"
    />

    <meta
      name="description"
      content="DIN BOT - WhatsApp Bot Admin Dashboard"
    />

    <title>DIN BOT - Admin Dashboard</title>

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        background: #0b0f19;
      }

      body {
        overflow-x: hidden;
      }

      #root {
        min-height: 100vh;
        background: #0b0f19;
      }

      /* Loading sebelum React tampil */
      #loading {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 15px;
        background: #0b0f19;
        color: #ffffff;
        font-family: Arial, sans-serif;
        transition: opacity 0.3s ease;
      }

      .loading-logo {
        width: 60px;
        height: 60px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 16px;
        background: #2563eb;
        color: #ffffff;
        font-size: 20px;
        font-weight: bold;
        box-shadow: 0 10px 30px rgba(37, 99, 235, 0.35);
      }

      .loading-text {
        font-size: 16px;
        font-weight: bold;
      }

      .loading-subtitle {
        color: #9ca3af;
        font-size: 12px;
      }

      .loader {
        width: 25px;
        height: 25px;
        border: 3px solid #374151;
        border-top-color: #2563eb;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>

    <div id="root">

      <!-- Tampilan sementara sebelum React selesai loading -->

      <div id="loading">

        <div class="loading-logo">
          DB
        </div>

        <div class="loading-text">
          DIN BOT
        </div>

        <div class="loading-subtitle">
          Admin Dashboard
        </div>

        <div class="loader"></div>

      </div>

    </div>

    <script type="module" src="/src/main.jsx"></script>

    <script>
      window.addEventListener("load", function () {
        setTimeout(function () {
          const loading =
            document.getElementById("loading");

          if (loading) {
            loading.style.opacity = "0";

            setTimeout(function () {
              loading.remove();
            }, 300);
          }
        }, 300);
      });
    </script>

  </body>
</html>
