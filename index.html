<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="theme-color"
      content="#0b0f19"
    />

    <meta
      name="description"
      content="DIN BOT WhatsApp Admin Panel"
    />

    <title>DIN BOT - Admin Panel</title>

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        background: #0b0f19;
      }

      body {
        overflow-x: hidden;
      }

      #root {
        min-height: 100vh;
        background: #0b0f19;
      }

      #loading {
        position: fixed;
        inset: 0;
        z-index: 9999;

        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 15px;

        background: #0b0f19;
        color: white;

        font-family: Arial, sans-serif;
      }

      .loading-logo {
        width: 60px;
        height: 60px;

        display: flex;
        align-items: center;
        justify-content: center;

        border-radius: 16px;

        background: #2563eb;
        color: white;

        font-size: 20px;
        font-weight: bold;
      }

      .loading-text {
        font-size: 17px;
        font-weight: bold;
      }

      .loading-subtitle {
        color: #9ca3af;
        font-size: 12px;
      }

      .loader {
        width: 25px;
        height: 25px;

        border: 3px solid #374151;
        border-top-color: #2563eb;

        border-radius: 50%;

        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>

    <div id="root">

      <div id="loading">

        <div class="loading-logo">
          DB
        </div>

        <div class="loading-text">
          DIN BOT
        </div>

        <div class="loading-subtitle">
          WhatsApp Admin Panel
        </div>

        <div class="loader"></div>

      </div>

    </div>

    <script type="module" src="/src/main.jsx"></script>

    <script>
      window.addEventListener("load", function () {

        setTimeout(function () {

          const loading =
            document.getElementById("loading");

          if (loading) {

            loading.style.opacity = "0";

            loading.style.transition =
              "opacity 0.3s ease";

            setTimeout(function () {
              loading.remove();
            }, 300);

          }

        }, 300);

      });
    </script>

  </body>
</html>
